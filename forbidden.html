<!DOCTYPE html>
<html lang="zh-Hans">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>访问被拒绝 - GitHub 文件加速</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    .flex {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      padding: 50px 40px;
      max-width: 560px;
      width: 100%;
      margin: 20px 0;
      text-align: center;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 30px;
      background: linear-gradient(135deg, #f56565 0%, #c53030 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(245, 101, 101, 0.3);
    }

    .icon svg {
      width: 40px;
      height: 40px;
      fill: #ffffff;
    }

    h1 {
      margin: 0 0 20px 0;
      font-size: 28px;
      color: #333;
      font-weight: 600;
    }

    .error-code {
      font-size: 64px;
      font-weight: 700;
      color: #c53030;
      margin: 0 0 20px 0;
      line-height: 1;
    }

    .message {
      color: #666;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .url-box {
      background: #f8f9fa;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      margin: 20px 0;
      word-break: break-all;
      font-family: "Courier New", monospace;
      font-size: 14px;
      color: #495057;
    }

    .url-box .label {
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      display: block;
    }

    .actions {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid #f0f0f0;
    }

    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
    }

    .footer a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      padding-bottom: 2px;
      transition: border-color 0.3s ease;
    }

    .footer a:hover {
      border-bottom-color: #ffffff;
    }

    .reason {
      background: #fff5f5;
      border-left: 4px solid #c53030;
      padding: 15px;
      margin: 20px 0;
      text-align: left;
      border-radius: 4px;
    }

    .reason-title {
      font-weight: 600;
      color: #c53030;
      margin-bottom: 8px;
    }

    .reason-text {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (min-height: 820px) {
      body {
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path
          d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2a8 8 0 0 1 4.9 1.67L5.67 16.9A8 8 0 0 1 12 4Zm0 16a8 8 0 0 1-4.9-1.67L18.33 7.1A8 8 0 0 1 12 20Z" />
      </svg>
    </div>
    <div class="error-code">403</div>
    <h1>访问被拒绝</h1>
    <p class="message">
      抱歉，您请求的网址在黑名单中，无法通过此加速服务访问。
    </p>

    <div class="url-box">
      <span class="label">请求的网址：</span>
      <span id="blocked-url">加载中...</span>
    </div>

    <div class="reason">
      <div class="reason-title">为什么被禁止？</div>
      <div class="reason-text">
        该地址不在加速服务允许访问的范围内。如有疑问，请联系服务管理员。
      </div>
    </div>

    <div class="actions">
      <a href="./" class="btn">返回首页</a>
    </div>
  </div>

  <p class="footer">
    项目使用 Cloudflare CDN 加速，开源于 GitHub
    <a href="https://github.com/benzBrake/gh-proxy" target="_blank" rel="noopener noreferrer">benzBrake/gh-proxy</a>
  </p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const blockedUrl = params.get('url') ||
      params.get('q') ||
      document.referrer ||
      '未知网址';
    document.getElementById('blocked-url').textContent = blockedUrl;

    const errorMessage = params.get('message');
    if (errorMessage) {
      const messageElement = document.querySelector('.message');
      messageElement.textContent = errorMessage;
    }
  </script>
</body>

</html>
